<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SizeWorld</title>
  <meta name="description" content="Shoe and clothing size converter: US, EU, UK, Japan, Korea and more.">
  <meta name="robots" content="noindex">
  <meta property="og:title" content="SizeWorld: Shoe &amp; Clothes Size">
  <meta property="og:description" content="Convert shoe and clothing sizes between countries in one tap.">
  <style>
    :root { color-scheme: light dark; --text: #1c2233; --muted: #5b6474; --bg: #ffffff; --card: #f3f5fa; --accent: #101F3E; --on-accent: #ffffff; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --text: #e8ecf4; --muted: #a3acbd; --bg: #101726; --card: #1a2335; --accent: #FFC72C; --on-accent: #101F3E; } }
    :root[data-theme="dark"] { --text: #e8ecf4; --muted: #a3acbd; --bg: #101726; --card: #1a2335; --accent: #FFC72C; --on-accent: #101F3E; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    main { max-width: 480px; margin: 0 auto; padding: 48px 16px; text-align: center; }
    h1 { font-size: 1.6rem; margin: 16px 0 8px; letter-spacing: -0.02em; }
    p { color: var(--muted); margin: 0 0 24px; }
    .btn { display: block; padding: 14px 20px; border-radius: 14px; font-weight: 700; text-decoration: none; margin: 12px 0; }
    .primary { background: var(--accent); color: var(--on-accent); }
    .secondary { background: var(--card); color: var(--text); }
    .logo { width: 72px; height: 72px; border-radius: 18px; background: #fff; }
  </style>
</head>
<body>
<main>
  <img class="logo" src="../icon.png" alt="" onerror="this.remove()">
  <h1 id="title">Someone shared a size with you</h1>
  <p id="lead">Open it in SizeWorld, the free shoe and clothing size converter.</p>
  <a class="btn primary" id="open" href="#">Open in SizeWorld</a>
  <a class="btn secondary" id="get" href="https://play.google.com/store/apps/details?id=com.sizeworld.converter&amp;referrer=utm_source%3Dshare_link">Get it on Google Play</a>
</main>
<script>
  // The shared data is in the fragment (#...), which the browser never sends to this server.
  (function () {
    var data = location.hash.replace(/^#/, '');
    var play = 'https://play.google.com/store/apps/details?id=com.sizeworld.converter&referrer=utm_source%3Dshare_link';
    var isAndroid = /android/i.test(navigator.userAgent);
    var isIos = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var appStore = 'https://apps.apple.com/app/id6836928501';
    var get = document.getElementById('get');
    if (isIos) {
      get.href = appStore;
      get.textContent = 'Download on the App Store';
    }
    var isProfile = /(^|&)g=/.test(data);
    var es = /^(es|ca)/i.test(navigator.language || '');
    if (es) {
      document.documentElement.lang = 'es';
      document.getElementById('title').textContent = isProfile ? 'Te han compartido unas tallas' : 'Te han compartido una talla';
      document.getElementById('lead').textContent = 'Ábrela en SizeWorld, el conversor de tallas de calzado y ropa gratis.';
      document.getElementById('open').textContent = 'Abrir en SizeWorld';
      get.textContent = isIos ? 'Descárgala en el App Store' : 'Disponible en Google Play';
    } else if (isProfile) {
      document.getElementById('title').textContent = 'Someone shared their sizes with you';
    }
    // Android: an intent URL opens the app, or Google Play when it is not installed.
    // iOS: the sizeworld:// button opens the app; Safari cannot fall back on its own, so the App Store button stays.
    var open = isAndroid
      ? 'intent://open?' + data + '#Intent;scheme=sizeworld;package=com.sizeworld.converter;S.browser_fallback_url=' + encodeURIComponent(play) + ';end'
      : 'sizeworld://open?' + data;
    var button = document.getElementById('open');
    if (data === '') {
      button.remove();
      return;
    }
    button.href = open;
    if (isAndroid) {
      location.replace(open);
    }
  })();
</script>
</body>
</html>
